<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Impressum – Pachapaul</title><link rel="icon" href="favicon.png"><meta name="robots" content="noindex"><style>
:root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2e;--text:#f2efe9;--muted:#a8a39a;--red:#e2372b;--orange:#f0782c;--blue:#2a8fa8;--gold:#d8b86a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;height:60px}
nav img{width:34px;height:34px;border-radius:50%}
nav b{letter-spacing:.18em;font-size:15px}
nav .links{margin-left:auto;display:flex;gap:20px;font-size:15px}
nav .links a{text-decoration:none;color:var(--muted)}
nav .links a:hover{color:var(--text)}
header{padding:90px 0 70px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(226,55,43,.18),transparent 60%)}
header .logo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 60px rgba(240,120,44,.25)}
h1{font-size:clamp(46px,10vw,104px);letter-spacing:.12em;font-weight:900;line-height:1;margin:28px 0 14px}
.claim{font-size:clamp(18px,2.6vw,24px);color:var(--muted);max-width:640px;margin:0 auto}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:16px;border:1px solid var(--line)}
.btn.sp{background:#1ed760;color:#000;border-color:#1ed760}
.btn.yt{background:var(--red);color:#fff;border-color:var(--red)}
.btn:hover{filter:brightness(1.1)}
section{padding:70px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}
.album{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.album:hover{transform:translateY(-4px);border-color:#444}
.album img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.album div{padding:14px 16px 18px}
.album h3{font-size:18px;line-height:1.3}
.album p{color:var(--muted);font-size:14px;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:10px}
.album.soon .tag{color:var(--orange)}
.video{display:block;position:relative;border-radius:14px;overflow:hidden;max-width:860px;border:1px solid var(--line)}
.video img{width:100%;display:block}
.video span{position:absolute;inset:0;display:grid;place-items:center}
.video span i{width:84px;height:84px;border-radius:50%;background:rgba(226,55,43,.92);display:grid;place-items:center;font-style:normal;font-size:34px;padding-left:6px}
.video:hover span i{transform:scale(1.06)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.about p{margin-bottom:16px}
.facts{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.facts li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.facts li:last-child{border:0}
.facts span{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:34px 0 50px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
footer a{color:var(--muted)}
@media(max-width:760px){.about{grid-template-columns:1fr}nav .links{gap:14px;font-size:14px}nav b{display:none}header{padding:60px 0 50px}}
 main{padding:60px 0 80px} main h1{font-size:40px;letter-spacing:0;margin:0 0 24px} main h3{margin:28px 0 6px} main p{color:var(--muted);margin-bottom:10px;max-width:760px}</style></head><body><nav><div class="wrap"><a href="index.html"><img src="img/plakette.png" alt="Startseite"></a><b>PACHAPAUL</b><div class="links"><a href="index.html">Zurück zur Startseite</a></div></div></nav><main><div class="wrap"><h1>Impressum</h1>
